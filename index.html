<!DOCTYPE html>
<html lang="id">
<head>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- LANDING LOGIN -->

<div id="landing">

<img src="https://raw.githubusercontent.com/ginanjarachmad4-del/asset-logo/main/logo-danantara.png" class="landing-logo left">

<footer class="footer">

</footer>

</div>
