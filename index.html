<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pusat Media Operasional KA</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- LANDING LOGIN -->

<div id="landing">

<img src="https://raw.githubusercontent.com/ginanjarachmad4-del/asset-logo/refs/heads/main/logo_danantara_warna.png" class="landing-logo left">
<img src="https://raw.githubusercontent.com/ginanjarachmad4-del/asset-logo/refs/heads/main/logo_kai.png" class="landing-logo right">

<div class="overlay">

<h1>SELAMAT DATANG DI PUSDALOPKA 2 BANDUNG</h1>

<button id="enterBtn">Masuk</button>

</div>

</div>

<header class="main-header">

  <div class="header-logo">
<img 
  src="https://raw.githubusercontent.com/ginanjarachmad4-del/asset-logo/refs/heads/main/logo_danantara_warna.png"
  class="header-logo left"
  alt="Logo Danantara">

<img 
  src="https://raw.githubusercontent.com/ginanjarachmad4-del/asset-logo/refs/heads/main/logo_kai.png"
  class="header-logo right"
  alt="Logo KAI">
  </div>

  <div class="rocc-header">
    <div class="rocc-title">
      <div class="line-1">R O C C – RAILWAY OPERATION CONTROL CENTER</div>
      <div class="line-2">Pusdalopka 2 Bandung</div>
      <div class="line-3">
        <span class="status">REALTIME OPERATION</span>
        <span class="dot"></span>
        <span id="clock">--:--:--</span>
      </div>
    </div>
  </div>

</header>

<div class="tabs">

<div class="tab active" data-tab="video">🎬 VIDEO</div>
<div class="tab" data-tab="pdf">📄 PERATURAN DINAS</div>

</div>

<!-- VIDEO -->

<div class="tab-content active" id="video">

<div class="video-layout">

<div class="playlist" id="playlist">Loading...</div>

<div class="player-wrapper">
<iframe id="player"></iframe>
</div>

</div>

</div>

<!-- PDF -->

<div class="tab-content" id="pdf">

<div class="pdf-list" id="pdfList">Loading PDF...</div>

</div>

<footer class="footer">
© 2026 • Achmad Teguh Ginanjar
</footer>

<!-- PDF VIEWER -->

<div id="pdfModal">

<div class="pdf-modal-content">

<div class="pdf-topbar">

<button id="closePdf" onclick="closePDF()">✕ Tutup</button>
<button onclick="downloadPdf()">⬇ Download</button>

</div>

<iframe id="pdfFrame"></iframe>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
